apiVersion: v1
kind: Pod
metadata:
  name: mig-clubbed-test
  labels:
    app: mig-clubbed-test-label
spec:
  containers:
  - name: pytorch-container
    image: <head-node>/nvcr.io/nvidia/pytorch:24.10-py3
    resources: # requesting TWO 1g.18gb slices in one pod, since 2g.35gb doesn't exist on this cluster
      requests:
        cpu: "4"
        memory: "8Gi"
        nvidia.com/mig-1g.18gb: 2
      limits:
        cpu: "4"
        memory: "8Gi"
        nvidia.com/mig-1g.18gb: 2
    command: ["/bin/bash", "-c", "while true; do sleep 3600; done"]
