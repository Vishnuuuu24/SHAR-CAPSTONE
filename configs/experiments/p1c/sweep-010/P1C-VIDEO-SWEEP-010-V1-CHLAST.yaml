# P1C-VIDEO-SWEEP-010-V1-CHLAST: generated throughput variant.
#
# GENERATED by scripts/sweep_p1c_throughput.py from P1C-VIDEO-SWEEP-009-R224-B64.yaml.
# Exactly one field differs from that parent: training.throughput.
# Resolution (224x224), batch size (64), precision (bfloat16), manifests,
# digests, split, seed and device policy are all identical.
#
# Isolates: single factor vs V0: NHWC activation layout only.
#
# These options change kernel selection, not mathematics. The run is
# deterministic within this policy but is NOT bitwise comparable to a run
# under a different one, so no accuracy from this sweep is comparable
# across its points. Calibration only: throughput and device memory.
# P1C-VIDEO-SWEEP-009-R224-B64: generated grid point, 224x224 at batch 64.
#
# GENERATED by scripts/sweep_p1c_resolution_batch.py from
# P1C-VIDEO-PRECISION-CALIBRATION-007-BF16.yaml. Two fields differ from that parent:
# preprocessing.resize_height/width and training.batch_size. Precision is
# bfloat16 throughout the sweep, per the owner decision of 2026-08-25.
#
# This point is therefore NOT single-factor against its parent and cannot
# attribute a delta to resolution or batch size alone -- the grid as a whole
# is what separates them. Calibration only: throughput and memory, no
# accuracy, no model selection.
schema_version: 1.0.0
# Precision calibration 7: bfloat16 autocast against the CALIBRATION-006 float32 control.
#
# SINGLE-FACTOR. Exactly one field differs from
# P1C-VIDEO-GAP-CALIBRATION-006: `training.precision`. Same manifests, same
# digests, same split, same batch size, same loader, same seed, same device
# policy. That is deliberate -- 006 bundled four changes and could attribute
# nothing; this pair exists to attribute a throughput delta to precision alone.
#
# WHY THIS EXISTS. Until now `training.precision` was validated by
# `core.p1c_readiness` and then **never read by any code path**: a config could
# register `amp_float16` and the run would train in float32 while its manifest
# claimed otherwise. `core/precision.py` closes that, and these two configs are
# the first runs that actually exercise it.
#
# # bfloat16 keeps float32's 8-bit exponent, so gradient underflow is not a
# concern and **no loss scaling is used**. This is the lower-risk of the two
# and the expected default if either is adopted. Requires Ampere or newer; the
# H200 MIG slice supports it natively.
#
# NOT A SCIENTIFIC RESULT. Precision changes numerics, so accuracy from a
# mixed-precision run is not comparable to a float32 number and neither is a
# headline. This measures throughput and stability only. Any RESULT 1/RESULT 2
# comparison must hold precision fixed across its arms.
experiment:
  id: P1C-VIDEO-SWEEP-010-V1-CHLAST
  parent_id: P1C-VIDEO-SWEEP-009-R224-B64
  status: REGISTERED_CALIBRATION_READY
  run_class: calibration
  question: What throughput and stability does bfloat16 autocast deliver against the CALIBRATION-006 float32 control, with every other registered field identical?
  hypothesis: Non-research calibration. It measures a throughput delta attributable to precision alone and the stability cost of reduced precision. It selects no model, produces no comparable accuracy, and its numerics differ from every float32 result.
  change_from_parent:
    - training.precision - float32 -> amp_bfloat16
    - no other factor changed - manifests, digests, split, model, backbone, preprocessing, loss, optimizer, batch size, loader, seed and device policy are identical to P1C-VIDEO-GAP-CALIBRATION-006
fixed_protocol:
  model:
    control: gap_linear
    num_classes: 14
    # Official ClassIDs.txt order and spelling. Do not rename
    # Normal_Videos_event: the manifests carry the official label.
    class_names: [Abuse, Arrest, Arson, Assault, Burglary, Explosion, Fighting, Normal_Videos_event, RoadAccidents, Robbery, Shooting, Shoplifting, Stealing, Vandalism]
  backbone:
    family: torchvision_resnet50
    feature: layer4_C5_pre_GAP
    weights:
      enum: IMAGENET1K_V2
      source_url: https://download.pytorch.org/models/resnet50-11ad3fa6.pth
      path: .cache/weights/resnet50-11ad3fa6.pth
      sha256: 11ad3fa62ca79e40addfd354a8ec4b7c75143b3038b8d2a807fbc68deab379ca
  data:
    dataset_roots:
      ucf_crime_official_videos: Datasets/UCF Crime Official/raw/UCF_Crimes/Videos
    train:
      path: results/p1b/p1b-video-ar-fold1/train_manifest.csv
      sha256: 776b26326bf63ae391b9f60d9f2deeedc94959b5833f33896669ad92cbf6aa5c
    validation:
      path: results/p1b/p1b-video-ar-fold1/validation_manifest.csv
      sha256: 0619217d3afcfcddea55b43aadb1939b17f68d120f4d8891ae28eed43947436f
    # Bare absolute host path, like data.packed_frames before it: the blob is
    # 84.3 GiB and lives outside the repository, and inside a job pod it is the
    # node-local emptyDir copy that run_pod_job.sh stages via STAGE_FROM
    # (SCRATCH_MOUNT defaults to /scratch-emptydir). Staging 84.3 GiB at the
    # probed 562 MiB/s is about 2.6 minutes.
    #
    # The blob is NOT read directly from /home during a run: /home is NFS, and
    # random record reads against it are the access pattern D-33 exists to
    # avoid. The durable master copy lives there; the pod reads its own copy.
    #
    # Registered blob SHA-256, verified once at dataset construction:
    #   fba97c7b68612c9370bb84ddc41232a1a004b7d7a27d3cbb9f177c18d8323665
    video_frames:
      extract_closure_path: /scratch-emptydir/p1c-video-frames/extract_closure.json
  preprocessing:
    # 64x64 per D-37. The blob holds full 320x240 pixels, so raising this later
    # is a loader-configuration change and a rerun, not a re-extraction.
    resize_height: 224
    resize_width: 224
    interpolation: bilinear
    color_mode: RGB
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  loss:
    name: cross_entropy
    reduction: mean
    class_balance: none
  training:
    batch_size: 64
    loader:
      num_workers: 6
      pin_memory: true
      persistent_workers: true
      drop_last: false
      # Registered true, and enforced: under the video-blob path this no longer
      # gates a per-row digest walk -- the blob's own SHA-256 is verified once
      # at construction -- but the runner refuses a config that registers false
      # here, so a config cannot claim a weaker verification posture than the
      # run performs.
      verify_digests: true
    optimizer:
      name: AdamW
      lr: 0.0003
      weight_decay: 0.0001
    device_policy: cuda_strict
    precision: amp_bfloat16
    throughput:
      channels_last: true
      compile: none
      fused_optimizer: false
  calibration:
    seed: 0
    warmup_train_batches: 3
    measured_train_batches: 10
    measured_validation_batches: 10
    full_epochs_for_estimate: 20
    overhead_factor_range: [1.15, 1.35]
    scope:
      research_training: false
      checkpoint_saved: false
      held_out_test_access: false
      configuration_selection: false
gates:
  owner_registration_required: false
  code_formula_audit: P1C-CODE-AUDIT-002
  measurement_decision: D-30
  expected_preflight: >-
    stage the blob directory into the pod's emptyDir with
    STAGE_FROM=<repo>/results/p1c/p1c-video-frames,
    which run_pod_job.sh copies to $SCRATCH_MOUNT and size-checks before the
    runner starts
  output: immutable_calibration_artifact_and_wall_clock_eta
  stop_conditions:
    - manifest_or_weight_digest_mismatch
    - source_video_leakage
    - device_fallback_or_nonfinite_loss
    - torch_or_torchvision_version_differs_from_the_registered_environment
    - video_blob_sha256_mismatch_or_missing_extract_closure
    - loader_wait_exceeds_50_percent_of_train_wall
